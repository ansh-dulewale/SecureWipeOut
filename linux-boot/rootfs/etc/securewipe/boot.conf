# SecureWipe Boot Configuration
# Alpine Linux configuration for the SecureWipe bootable environment

# Hostname
hostname="securewipe-boot"

# Network (disabled for security)
auto_setup_network="no"

# Keymap (US English)
keymap="us"

# Timezone
timezone="UTC"

# Services to start
rc_services="hwdrivers hardware-detect securewipe"

# Root password (disabled - read-only system)
root_password="disabled"

# Boot logging
rc_logger="YES"
rc_log_path="/var/log/rc.log"

# Hardware detection
modloop="/boot/modloop-grsec"
modules="sd-mod,usb-storage,ata_piix,ahci,nvme"

# Memory filesystem options
tmpfs="true"
tmpfs_size="256M"

# Auto-mount detection
auto_mount="no"

# Console settings
console="tty1"
console_font="default"
console_keymap="us"

# Security settings
secure_boot="true"
read_only_root="true"

# SecureWipe specific settings
export SECUREWIPE_MODE="bootable"
export SECUREWIPE_AUTO_DETECT="true"
export SECUREWIPE_LOG_LEVEL="info"