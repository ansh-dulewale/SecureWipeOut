# GRUB Configuration for SecureWipe Bootable Environment
# Supports both BIOS and UEFI boot modes

set timeout=5
set default=0

# Set colors for better visibility
set color_normal=white/black
set color_highlight=black/light-gray

# Menu entry for SecureWipe
menuentry "SecureWipe - Secure Data Sanitization" {
    echo "Loading SecureWipe kernel..."
    linux /boot/vmlinuz-securewipe quiet splash root=/dev/ram0 init=/sbin/init securewipe_auto=true
    echo "Loading initial RAM disk..."
    initrd /boot/initramfs-securewipe
}

menuentry "SecureWipe - Safe Mode (Debug)" {
    echo "Loading SecureWipe in debug mode..."
    linux /boot/vmlinuz-securewipe root=/dev/ram0 init=/sbin/init securewipe_debug=true
    echo "Loading initial RAM disk..."
    initrd /boot/initramfs-securewipe
}

menuentry "Memory Test (Memtest86+)" {
    echo "Loading memory test..."
    linux16 /boot/memtest86+
}

menuentry "Reboot System" {
    echo "Rebooting..."
    reboot
}

menuentry "Power Off System" {
    echo "Shutting down..."
    halt
}

# Boot automatically after timeout
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Display boot information
echo "SecureWipe v1.0.0 - Secure Data Sanitization System"
echo "Copyright (c) 2025 - Licensed under GPL v3"